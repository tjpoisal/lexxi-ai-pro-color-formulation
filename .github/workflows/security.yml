name: security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --ignore-scripts
        timeout-minutes: 15

      - name: NPM audit (report)
        continue-on-error: true
        run: npm audit --omit=dev --json > npm-audit.json 2>&1 || true
        timeout-minutes: 5

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30

      - name: Comment audit on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
              if (audit.metadata && audit.metadata.vulnerabilities) {
                const { critical = 0, high = 0, moderate = 0, low = 0 } = audit.metadata.vulnerabilities;
                const comment = `## Security Audit Results\n\n- Critical: ${critical}\n- High: ${high}\n- Moderate: ${moderate}\n- Low: ${low}`;
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (err) {
              console.error('Audit script error:', err.message);
            }
