name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: npm is intentionally omitted — no package-lock.json is
          # committed, so setup-node cannot compute the cache key.

      - name: Install dependencies
        run: npm install --no-audit --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Test
        run: npm test -- --passWithNoTests --watchAll=false
