name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --ignore-scripts

      - name: Lint
        # ESLint exits 0 on warnings (only errors fail CI).
        # @typescript-eslint/no-unused-vars is set to 'warn' so unused vars
        # are surfaced in this output without blocking the build.
        run: npm run lint

      - name: Test
        # --passWithNoTests keeps CI green until real tests are added.
        # Remove that flag once the first test file is committed.
        run: npm test -- --passWithNoTests --watchAll=false

      - name: Report lint summary
        if: always()
        run: |
          echo "### Lint & Test complete" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: warnings are visible above (no-unused-vars is warn, not error)" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: passWithNoTests is active — add test files to src/__tests__/ to cover new logic" >> $GITHUB_STEP_SUMMARY
